name: zikr_tasbeeh
description: "Tasbeeh Zikr Counter - an offline floating dhikr counter for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.6
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  flutter_timezone: 5.1.1
  adhan: 2.0.0+1
  vibration: 3.2.1
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/click.wav
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
